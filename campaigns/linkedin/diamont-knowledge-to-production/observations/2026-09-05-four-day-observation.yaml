  - Email delivery figures reflect subscriber count at publication time, not the current subscriber base.
data_quality_notes:
  - LinkedIn describes these metrics as estimates and values can change between captures.
  - Aggregate totals do not exactly equal the sum of the two individual snapshots: 238 versus 247 impressions, 3 versus 5 engagements, and 12 versus 13 article views.
  - Preserve both aggregate and per-edition values without forcing reconciliation because the screenshots may represent different refresh times or counting scopes.
