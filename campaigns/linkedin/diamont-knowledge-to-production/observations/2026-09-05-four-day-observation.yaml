interpretation:
  - Subscriber growth is strong in volume, rising from the publication baseline of 1 to 145.
  - Article readership and substantive engagement remain early and limited; subscriber growth must not be interpreted as commercial demand.
  - Edition 02 generated more article views than edition 01 despite similar reach, supporting continued use of problem-led titles and concrete contrasts.
  - Edition 01 reached a larger share outside the author's network, which is useful for discovery.
